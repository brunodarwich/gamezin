<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Gamezin - 2.5D Isométrico Suave</title>
  <link rel="stylesheet" href="style.css?v=20261012b">
</head>
<body>
  <!-- Canvas do Jogo -->
  <canvas id="gameCanvas"></canvas>

  <!-- Overlay para Joystick Virtual na tela de toque/mobile -->
  <div id="joystickZone">
    <div id="joystickBase">
      <div id="joystickKnob"></div>
    </div>
  </div>

  <!-- HUD simples de coordenadas e instruções -->
  <div id="hud">
    <div id="posDisplay">X: 0 | Y: 0</div>
    <div id="controlsHint">Mover: WASD/Setas/Clique | Zoom: + / - ou Scroll</div>
    <!-- Controles da Direita: Contador Discreto de Visitas e Zoom -->
    <div id="hudRightGroup">
      <div id="visitorBadge" class="visitor-badge" title="Visualizações • Clique para ver por país">
        <button id="btnVisitorStats" class="visitor-btn" aria-label="Ver visitantes por país" type="button">
          <svg class="eye-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <span id="visitorCountDisplay">--</span>
        </button>
      </div>
      <div id="zoomControls">
        <button id="btnZoomIn" title="Aproximar (+)">+</button>
        <button id="btnZoomReset" title="Zoom Padrão (0)">1x</button>
        <button id="btnZoomOut" title="Afastar (-)">−</button>
      </div>
    </div>
  </div>

  <!-- Modal Glassmorphism de Estatísticas de Visitantes por País -->
  <div id="visitorModal" class="visitor-modal-backdrop visitor-ui-hidden" role="dialog" aria-modal="true" aria-labelledby="visitorModalTitle">
    <div class="visitor-modal-card">
      <div class="visitor-modal-header">
        <div class="visitor-modal-title-group">
          <div class="visitor-modal-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </div>
          <div>
            <h3 id="visitorModalTitle">Visitantes pelo Mundo</h3>
            <p id="visitorModalSubtitle">Total de acessos: <span id="modalTotalVisits">--</span></p>
          </div>
        </div>
        <button id="btnCloseVisitorModal" class="visitor-modal-close" title="Fechar (Esc)" type="button">✕</button>
      </div>
      <div class="visitor-modal-body">
        <div id="visitorCountriesList" class="visitor-countries-list">
          <!-- Renderizado dinamicamente pelo visitor-counter.js -->
        </div>
      </div>
      <div class="visitor-modal-footer">
        <span id="visitorEnvTag" class="visitor-tag visitor-tag-live">🟢 Versão Publicada</span>
        <span class="visitor-note">Atualizado em tempo real</span>
      </div>
    </div>
  </div>

  <!-- Balão de Fala do Jogador Projetado em 3D sobre o Viajante -->
  <div id="playerSpeechBubble" class="player-speech-bubble npc-ui-hidden">
    <div id="playerSpeechText" class="player-bubble-text"></div>
    <div class="player-bubble-arrow"></div>
  </div>

  <!-- Botão Flutuante de Interação com NPC -->
  <div id="npcPrompt" class="npc-ui-hidden">
    <button id="btnNpcInteract">
      <span class="prompt-key">E</span>
      <span class="prompt-label">Conversar</span>
    </button>
  </div>

  <!-- Balão de Fala do NPC Projetado em 3D -->
  <div id="npcSpeechBubble" class="npc-ui-hidden">
    <div id="npcSpeechText"></div>
    <div class="bubble-arrow"></div>
  </div>

  <!-- Barra de Chat de Diálogo no Rodapé -->
  <div id="npcChatBar" class="npc-ui-hidden">
    <div class="chat-inner">
      <div class="chat-header-row">
        <div class="chat-turn-indicator">Conversa: <span id="interactionTurnCount">0</span>/5</div>
        <button id="btnCloseChat" title="Encerrar conversa (Esc)">✕ Encerrar</button>
      </div>
      <form id="npcChatForm" class="chat-input-row" onsubmit="return false;">
        <input type="text" id="npcChatInput" placeholder="Pergunte algo ou compartilhe o que passa pela sua mente..." maxlength="250" autocomplete="off" />
        <button type="submit" id="btnSendChat">Enviar</button>
      </form>
    </div>
  </div>

  <script src="three.min.js"></script>
  <script src="game.js?v=20261012b"></script>
  <script src="visitor-counter.js?v=20261012b"></script>
</body>
</html>
