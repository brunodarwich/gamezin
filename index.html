<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Gamezin - 2.5D Isométrico Suave</title>
  <link rel="stylesheet" href="style.css?v=20261011c">
</head>
<body>
  <!-- Canvas do Jogo -->
  <canvas id="gameCanvas"></canvas>

  <!-- Overlay para Joystick Virtual na tela de toque/mobile -->
  <div id="joystickZone">
    <div id="joystickBase">
      <div id="joystickKnob"></div>
    </div>
  </div>

  <!-- HUD simples de coordenadas e instruções -->
  <div id="hud">
    <div id="posDisplay">X: 0 | Y: 0</div>
    <div id="controlsHint">Mover: WASD/Setas/Clique | Zoom: + / - ou Scroll</div>
    <!-- Controles de Zoom para Desktop e Mobile -->
    <div id="zoomControls">
      <button id="btnZoomIn" title="Aproximar (+)">+</button>
      <button id="btnZoomReset" title="Zoom Padrão (0)">1x</button>
      <button id="btnZoomOut" title="Afastar (-)">−</button>
    </div>
  </div>

  <!-- Botão Flutuante de Interação com NPC -->
  <div id="npcPrompt" class="npc-ui-hidden">
    <button id="btnNpcInteract">
      <span class="prompt-key">E</span>
      <span class="prompt-label">Conversar</span>
    </button>
  </div>

  <!-- Balão de Fala do NPC Projetado em 3D -->
  <div id="npcSpeechBubble" class="npc-ui-hidden">
    <div class="bubble-header">
      <span class="bubble-speaker">Mestre Sábio</span>
      <span id="speechStateTag" class="bubble-tag"></span>
    </div>
    <div id="npcSpeechText"></div>
    <div class="bubble-arrow"></div>
  </div>

  <!-- Barra de Chat de Diálogo no Rodapé -->
  <div id="npcChatBar" class="npc-ui-hidden">
    <div class="chat-inner">
      <div class="chat-header-row">
        <div class="chat-turn-indicator">Ensinamentos: <span id="interactionTurnCount">0</span>/5</div>
        <button id="btnCloseChat" title="Encerrar conversa (Esc)">✕ Encerrar</button>
      </div>
      <form id="npcChatForm" class="chat-input-row" onsubmit="return false;">
        <input type="text" id="npcChatInput" placeholder="Pergunte algo ou compartilhe o que passa pela sua mente..." maxlength="250" autocomplete="off" />
        <button type="submit" id="btnSendChat">Enviar</button>
      </form>
    </div>
  </div>

  <script src="three.min.js"></script>
  <script src="game.js?v=20261011c"></script>
</body>
</html>
